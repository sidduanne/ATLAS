# ATLAS runs entirely in Docker. Nothing besides Docker is needed on the host.
# - On your machine: docker compose up -d --build                      -> http://127.0.0.1:5173
# - On a web server: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only the web app is published, and only on 127.0.0.1; the database and backend stay inside Docker.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: multimodal-retrieval-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multimodal_retrieval}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        PRELOAD_MODELS: ${PRELOAD_MODELS:-1}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-multimodal_retrieval}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
    volumes:
      # Uploaded sources, figure crops and (if not preloaded) model downloads.
      - atlas_data:/app/data
      # Experiment reports shown on the Experiments page.
      - atlas_results:/app/experiments/results
      # Read-only drop folder for bulk imports with scripts/import_corpus.py.
      - ./data/pdfs:/app/import:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Optional HTTP basic auth for the whole site (required in production).
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:${ATLAS_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  atlas_data:
  atlas_results:
