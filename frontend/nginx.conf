server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 500m;

    # Written at container start: basic auth when BASIC_AUTH_USER/PASSWORD are set, else empty.
    include /etc/nginx/snippets/auth.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
    # Health stays public so uptime checks work without credentials.
    location = /health { auth_basic off; proxy_pass http://backend:8001; }
    # Interactive API docs (behind the same login as the app).
    location = /docs { proxy_pass http://backend:8001; }
    location = /openapi.json { proxy_pass http://backend:8001; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
